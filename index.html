<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3eb">
  <meta name="description" content="传统食养食材属性、搭配检查与食疗方查询">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>食养知行 - 食材属性与搭配查询</title>
  <script>
    (function () {
      window.__atlasInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__atlasInstallPrompt = event;
        window.dispatchEvent(new Event("atlas:beforeinstallprompt"));
      });
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-view="home" aria-label="返回首页">
        <span class="brand-mark">食</span>
        <span>
          <strong>食养知行</strong>
          <small>传统食养 · 现代安全提示</small>
        </span>
      </button>
      <button class="text-button" data-view="profile">数据说明</button>
    </header>

    <main id="app" class="app-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主要导航">
      <button class="nav-button active" data-view="home">
        <span class="nav-glyph">首</span>
        <span>首页</span>
      </button>
      <button class="nav-button" data-view="library">
        <span class="nav-glyph">库</span>
        <span>食材</span>
      </button>
      <button class="nav-button" data-view="checker">
        <span class="nav-glyph">配</span>
        <span>搭配</span>
      </button>
      <button class="nav-button" data-view="recipes">
        <span class="nav-glyph">方</span>
        <span>食疗</span>
      </button>
      <button class="nav-button" data-view="profile">
        <span class="nav-glyph">我</span>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <aside id="detailSheet" class="detail-sheet" aria-modal="true" role="dialog" aria-label="详情" hidden>
    <div class="sheet-handle"></div>
    <button id="closeSheet" class="sheet-close" aria-label="关闭详情">关闭</button>
    <div id="sheetContent" class="sheet-content"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="atlas-bootstrap.js"></script>
</body>
</html>
