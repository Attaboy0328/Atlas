<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3eb">
  <meta name="description" content="传统食养食材属性、搭配检查与食疗方查询">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>食养知行 - 食材属性与搭配查询</title>
  <script>
    (function () {
      window.__atlasInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__atlasInstallPrompt = event;
        window.dispatchEvent(new Event("atlas:beforeinstallprompt"));
      });
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-view="home" aria-label="返回首页">
        <img class="brand-mark" src="icons/icon-192.png" alt="" width="38" height="38" decoding="async">
        <span>
          <strong>食养知行</strong>
          <small>传统食养 · 现代安全提示</small>
        </span>
      </button>
      <button class="text-button" data-view="profile">数据说明</button>
    </header>

    <main id="app" class="app-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主要导航">
      <button class="nav-button active" data-view="home">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M5.5 10.5 12 5l6.5 5.5V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19v-8.5Z"/><path d="M10 21v-6.5h4V21"/></svg>
        </span>
        <span>首页</span>
      </button>
      <button class="nav-button" data-view="library">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h9"/><rect x="4" y="5" width="16" height="14" rx="2.5"/></svg>
        </span>
        <span>食材</span>
      </button>
      <button class="nav-button" data-view="checker">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M8.5 12.5h7M10 10.5l-2 2 2 2M14 10.5l2 2-2 2"/><rect x="4" y="5" width="16" height="14" rx="2.5"/></svg>
          <span class="nav-badge" hidden></span>
        </span>
        <span>搭配</span>
      </button>
      <button class="nav-button" data-view="recipes">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M6 9.5c0-2.2 2.7-4 6-4s6 1.8 6 4-2.7 4-6 4-6-1.8-6-4Z"/><path d="M6 9.5V14c0 2.2 2.7 4 6 4s6-1.8 6-4V9.5"/></svg>
        </span>
        <span>食疗</span>
      </button>
      <button class="nav-button" data-view="profile">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="8.5" r="3"/><path d="M6 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg>
        </span>
        <span>我的</span>
      </button>
      <span class="nav-indicator" aria-hidden="true"></span>
    </nav>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <aside id="detailSheet" class="detail-sheet" aria-modal="true" role="dialog" aria-label="详情" hidden>
    <div class="sheet-handle"></div>
    <button id="closeSheet" class="sheet-close" aria-label="关闭详情">关闭</button>
    <div id="sheetContent" class="sheet-content"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="atlas-bootstrap.js"></script>
</body>
</html>
